<html lang="en" data-theme="light">

<meta charset="UTF-8" />

<title>AutoEval — LLM Evaluation Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />

<style>
:root {
  --font-sans: 'Hanken Grotesk', -apple-system, system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', monospace;
  --r-sm: 5px;
  --r-md: 7px;
  --r-lg: 11px;
  --r-xl: 16px;
}

/* ===================== LIGHT (default) ===================== */
html[data-theme="light"] {
  --bg: oklch(0.985 0.003 265);
  --bg-inset: oklch(0.965 0.004 265);
  --surface: oklch(1 0 0);
  --surface-2: oklch(0.975 0.003 265);
  --surface-3: oklch(0.955 0.005 265);
  --border: oklch(0.915 0.005 265);
  --border-strong: oklch(0.86 0.008 265);
  --text: oklch(0.24 0.012 265);
  --text-2: oklch(0.44 0.012 265);
  --text-3: oklch(0.6 0.012 265);
  --text-faint: oklch(0.72 0.01 265);
  --accent: oklch(0.52 0.19 265);
  --accent-hover: oklch(0.46 0.19 265);
  --accent-soft: oklch(0.95 0.04 265);
  --accent-soft-border: oklch(0.86 0.07 265);
  --accent-text: oklch(0.46 0.19 265);
  --pos: oklch(0.58 0.15 155);
  --pos-soft: oklch(0.95 0.05 155);
  --warn: oklch(0.68 0.15 75);
  --warn-soft: oklch(0.95 0.06 80);
  --neg: oklch(0.58 0.19 25);
  --neg-soft: oklch(0.95 0.05 25);
  --shadow-sm: 0 1px 2px oklch(0.2 0.02 265 / 0.06), 0 1px 3px oklch(0.2 0.02 265 / 0.04);
  --shadow-md: 0 2px 6px oklch(0.2 0.02 265 / 0.07), 0 4px 16px oklch(0.2 0.02 265 / 0.06);
  --shadow-lg: 0 8px 30px oklch(0.2 0.02 265 / 0.12), 0 2px 8px oklch(0.2 0.02 265 / 0.08);
  --overlay: oklch(0.3 0.02 265 / 0.35);
}

/* ===================== DARK ===================== */
html[data-theme="dark"] {
  --bg: oklch(0.165 0.008 265);
  --bg-inset: oklch(0.14 0.008 265);
  --surface: oklch(0.205 0.01 265);
  --surface-2: oklch(0.235 0.012 265);
  --surface-3: oklch(0.27 0.014 265);
  --border: oklch(0.29 0.014 265);
  --border-strong: oklch(0.36 0.016 265);
  --text: oklch(0.96 0.004 265);
  --text-2: oklch(0.74 0.01 265);
  --text-3: oklch(0.62 0.012 265);
  --text-faint: oklch(0.5 0.012 265);
  --accent: oklch(0.68 0.16 265);
  --accent-hover: oklch(0.74 0.16 265);
  --accent-soft: oklch(0.3 0.07 265);
  --accent-soft-border: oklch(0.42 0.1 265);
  --accent-text: oklch(0.78 0.13 265);
  --pos: oklch(0.7 0.15 155);
  --pos-soft: oklch(0.3 0.07 155);
  --warn: oklch(0.78 0.14 80);
  --warn-soft: oklch(0.32 0.07 80);
  --neg: oklch(0.68 0.18 25);
  --neg-soft: oklch(0.32 0.09 25);
  --shadow-sm: 0 1px 2px oklch(0 0 0 / 0.3), 0 1px 3px oklch(0 0 0 / 0.2);
  --shadow-md: 0 2px 8px oklch(0 0 0 / 0.35), 0 6px 20px oklch(0 0 0 / 0.3);
  --shadow-lg: 0 12px 40px oklch(0 0 0 / 0.5), 0 4px 12px oklch(0 0 0 / 0.4);
  --overlay: oklch(0.1 0.01 265 / 0.6);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  font-feature-settings: "cv05" 1, "ss01" 1;
}
#root { height: 100%; }
.mono { font-family: var(--font-mono); font-feature-settings: "zero" 1; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
::selection { background: var(--accent-soft); }

/* scrollbars */
*::-webkit-scrollbar { width: 11px; height: 11px; }
*::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 99px; border: 3px solid transparent; background-clip: content-box; }
*::-webkit-scrollbar-thumb:hover { background: var(--text-faint); background-clip: content-box; border: 3px solid transparent; }
*::-webkit-scrollbar-track { background: transparent; }

/* utilities */
.row { display: flex; align-items: center; }
.col { display: flex; flex-direction: column; }
.gap-1 { gap: 4px; } .gap-2 { gap: 8px; } .gap-3 { gap: 12px; } .gap-4 { gap: 16px; } .gap-5 { gap: 20px; } .gap-6 { gap: 24px; }
.grow { flex: 1; }
.wrap { flex-wrap: wrap; }
.muted { color: var(--text-2); }
.faint { color: var(--text-3); }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes scaleIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
@keyframes shimmer { 0% { background-position: -400px 0; } 100% { background-position: 400px 0; } }
.view-enter { animation: slideUp 0.32s cubic-bezier(0.22,1,0.36,1); }
</style>
</head>
